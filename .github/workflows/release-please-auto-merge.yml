# Release PR auto-merge — closes the two-phase release loop (semver by type).
# release-please.yml opens/updates a standing "Release PR" (branch prefix
# release-please--) on every push to main. This workflow enables GitHub
# auto-merge on it: the PR merges itself once the required status checks pass.
# Combined with Conventional Commits titles, the window between two Release PR
# merges then drives the bump: fix-only → patch (1.7.1), feat → minor (1.8.0),
# feat!/BREAKING CHANGE → major (2.0.0); docs/chore/refactor do not release.
#
# Token: RELEASE_PLEASE_TOKEN (same fine-grained PAT as release-please.yml).
# Pushes made with a PAT DO trigger the follow-up workflows on main, which is
# what cuts the tag + GitHub Release after the auto-merge lands.
# Human override stays possible: disable auto-merge or close the Release PR.
name: Release PR auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge on Release PR
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release-please--')
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Release PR detected: $PR_URL"
          gh pr merge "$PR_URL" --auto --merge
          echo "auto-merge enabled — will merge when required checks pass"
