# Semantic release automation (release-please, cowork ai-cowork #4).
# Every push to main updates (or creates) the Release PR. Merging that PR
# tags vX.Y.Z and publishes a GitHub Release + semantic CHANGELOG.md.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # GITHUB_TOKEN can create the Release PR but does NOT trigger CI
          # workflows on it (GitHub limitation: events from GITHUB_TOKEN never
          # start new workflow runs). If the branch protection requires checks
          # on the Release PR, create a fine-grained PAT (contents:write,
          # pull-requests:write) and expose it as the RELEASE_PLEASE_TOKEN
          # repository secret — no config change needed (fallback below).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
