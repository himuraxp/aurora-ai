# Semantic release automation (release-please, cowork ai-cowork #4).
# Every push to main updates (or creates) the Release PR. Merging that PR
# tags vX.Y.Z and publishes a GitHub Release + semantic CHANGELOG.md.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-trigger (e.g. after rotating RELEASE_PLEASE_TOKEN)

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # TEMPORARY debug (cowork #4 P0): length + API status only — the secret
      # value is never printed (GitHub masks it in logs regardless).
      - name: Debug token (length + API code, never the value)
        run: |
          L=$(printf '%s' "${{ secrets.RELEASE_PLEASE_TOKEN }}" | wc -c | tr -d ' ')
          echo "token length: $L"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.RELEASE_PLEASE_TOKEN }}" https://api.github.com/repos/himuraxp/aurora-ai)
          echo "API code on repo endpoint: $CODE"
      - uses: googleapis/release-please-action@v4
        with:
          # Fine-grained PAT (repo himuraxp/aurora-ai, Contents:RW +
          # Pull requests:RW) — REQUIRED. GITHUB_TOKEN cannot be used: it is
          # blocked from creating PRs (repo setting) and never triggers CI
          # workflows on the Release PR it creates. No silent fallback: if the
          # secret is missing, this fails loudly.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
