# secret-scan — independent server-side enforcement of the pre-commit scanner.
#
# The local hook (scripts/hooks/pre-commit-secrets.sh) runs on the contributor's
# machine and can be bypassed (core.hooksPath, --no-verify, missing install).
# This workflow is the layer that does NOT depend on local configuration:
#   1. full-history gitleaks scan (repo .gitleaks.toml + .gitleaksignore apply),
#   2. the hook regex layer e2e fixture suite (must stay green).
# Branch protection should require this check on main (see
# docs/SECURITY-ACCEPTANCE.md). Minimal permissions: contents: read only —
# the job must never receive real credentials (defense-in-depth, CI-threat
# review 2026-10-09).

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks + hook fixture suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned by SHA
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned 8.30.1, checksum-verified)
        run: |
          version=8.30.1
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLo checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          expected=$(grep "gitleaks_${version}_linux_x64.tar.gz" checksums.txt | awk '{print $1}')
          echo "${expected}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Full-history secret scan
        run: gitleaks detect --redact --verbose

      - name: Hook regex layer (e2e fixture suite)
        run: bash scripts/hooks/test-pre-commit-patterns.sh
